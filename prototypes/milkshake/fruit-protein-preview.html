const nav = document.querySelector('nav');
const product = document.querySelector('#product');

function show(photo) {
  document.documentElement.style.setProperty('--light', photo.light);
  document.documentElement.style.setProperty('--color', photo.color);
  product.setAttribute('href', photo.src);
  document.querySelector('#description').textContent = 'Fruit & Protein ' + photo.name + ' con splash';
  for (const button of nav.children) {
    button.setAttribute('aria-pressed', String(button.textContent === photo.name));
  }
}

for (const name of ['Classic', 'Fragola', 'Banana', 'Mirtillo', 'Kiwi']) {
  const photo = photos.find(item => item.name === name);
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = name;
  button.addEventListener('click', () => show(photo));
  nav.append(button);
}

show(photos.find(photo => photo.name === 'Kiwi'));
</script>
